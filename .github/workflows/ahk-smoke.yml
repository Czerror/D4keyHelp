name: AHK Smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && !github.event.deleted && 'AHK Smoke (dev)' || 'smoke' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official AutoHotkey v2.0.31
        shell: pwsh
        run: |
          $ahkZip = "$env:RUNNER_TEMP\AutoHotkey_2.0.31.zip"
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip" -OutFile $ahkZip
          Expand-Archive -Path $ahkZip -DestinationPath "$env:RUNNER_TEMP\ahk"

      - name: Run AHK syntax smoke
        shell: pwsh
        run: |
          $errLog = "$env:RUNNER_TEMP\ahk_err.txt"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" `
            -ArgumentList '/ErrorStdOut=UTF-8 /Validate "D4 HELPv7.1.ahk"' `
            -WorkingDirectory "$env:GITHUB_WORKSPACE" `
            -Wait -PassThru -WindowStyle Hidden `
            -RedirectStandardError $errLog
          Get-Content $errLog -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            exit $p.ExitCode
          }

      - name: Run isolated behavior tests
        shell: pwsh
        run: ./tests/run.ps1 -AhkPath "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" -ScratchDir "$env:RUNNER_TEMP"
