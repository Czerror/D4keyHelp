name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release commit and window title
        shell: pwsh
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The checkout must be in origin/main history.' }

          $tag = $env:GITHUB_REF_NAME
          $entry = Get-Content -Raw -LiteralPath "$env:GITHUB_WORKSPACE\D4 HELPv7.1.ahk"
          $gui = [regex]::Match($entry, '(?ms)^class[ \t]+GUIManager[ \t]*\{.*?^\}').Value
          $titles = [regex]::Matches($gui, '(?m)^[ \t]*this\.myGui\s*:=\s*Gui\(\s*""\s*,\s*"D4 HELP ([^ \t"\r\n]+)')
          if ($titles.Count -ne 1) { throw 'Expected one D4 HELP main window title in GUIManager.' }
          $windowVersion = $titles[0].Groups[1].Value
          if ($windowVersion -cne $tag) {
            throw "The window title version $windowVersion must match the release tag $tag."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "D4_RELEASE_EXE=$env:RUNNER_TEMP\D4 HELP$tag.exe" -Encoding utf8

      - name: Download AutoHotkey v2.0.31 (official)
        shell: pwsh
        run: |
          $ahkZip = "$env:RUNNER_TEMP\AutoHotkey_2.0.31.zip"
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip" -OutFile $ahkZip
          Expand-Archive -Path $ahkZip -DestinationPath "$env:RUNNER_TEMP\ahk"
          Get-Item "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" | Select-Object Name, Length

      - name: Download Ahk2Exe (official compiler)
        shell: pwsh
        run: |
          $a2e = "Ahk2Exe1.1.37.02a2"
          $zip = "$env:RUNNER_TEMP\Ahk2Exe.zip"
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/download/$a2e/$a2e.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ahk2exe"
          Get-Item "$env:RUNNER_TEMP\ahk2exe\Ahk2Exe.exe" | Select-Object Name, Length

      - name: Syntax smoke (real script, entry replaced with ExitApp)
        shell: pwsh
        run: |
          $entry = Get-Content -Raw -LiteralPath "$env:GITHUB_WORKSPACE\D4 HELPv7.1.ahk"
          $smoke = $entry -replace 'GUIManager\.Initialize\(\)', 'ExitApp()'
          Set-Content -LiteralPath "$env:GITHUB_WORKSPACE\smoke.ahk" -Value $smoke -Encoding utf8
          $errLog = "$env:RUNNER_TEMP\smoke_err.txt"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" `
            -ArgumentList '/ErrorStdOut', 'smoke.ahk' `
            -WorkingDirectory "$env:GITHUB_WORKSPACE" `
            -Wait -PassThru -WindowStyle Hidden `
            -RedirectStandardError $errLog
          Get-Content $errLog -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Write-Error "AHK syntax smoke failed with exit code $($p.ExitCode)"
            exit $p.ExitCode
          }

      - name: Compile with Ahk2Exe
        shell: pwsh
        run: |
          $out = $env:D4_RELEASE_EXE
          $a2eArgs = @(
            '/in', "`"$env:GITHUB_WORKSPACE\D4 HELPv7.1.ahk`"",
            '/out', "`"$out`"",
            '/base', "`"$env:RUNNER_TEMP\ahk\AutoHotkey64.exe`"",
            '/ahk', "`"$env:RUNNER_TEMP\ahk\AutoHotkey64.exe`"",
            '/silent'
          )
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\ahk2exe\Ahk2Exe.exe" `
            -ArgumentList $a2eArgs -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) {
            Write-Error "Ahk2Exe failed with exit code $($p.ExitCode)"
            exit $p.ExitCode
          }
          $f = Get-Item -LiteralPath $out
          $hash = (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash
          Write-Output "Compiled OK: $($f.FullName) $($f.Length) bytes"
          Write-Output "SHA256: $hash"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $notesFile = "$env:RUNNER_TEMP\release_notes.md"

          # 取上一个 release 标签（当前 release 尚未创建）
          $prev = (gh release list --repo $repo --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' 2>$null)

          if ($prev -and $prev -ne $tag) {
            $range = "$prev..HEAD"
            $header = "## 自 $prev 以来的更新"
          } else {
            $range = "HEAD"
            $header = "## 更新说明（全量提交）"
          }
          $commits = git log --format="* %s (%h)" $range
          if (-not $commits) {
            $commits = "* 无新增提交"
          }
          $body = @(
            $header
            ""
            $commits
            ""
            "完整提交记录: https://github.com/$repo/commits/$tag"
          ) -join "`n"
          Set-Content -LiteralPath $notesFile -Value $body -Encoding utf8

          # 发布前从远端重新读取标签和 main，避免使用 checkout 时缓存的引用。
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/tags/${tag}:refs/release/tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the release tag and origin/main.' }
          $tagCommit = git rev-parse --verify 'refs/release/tag^{commit}'
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must point to a commit.' }
          $eventCommit = git rev-parse --verify "${env:GITHUB_SHA}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The push event must point to a commit.' }
          $checkoutCommit = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $eventCommit -or $tagCommit -ne $checkoutCommit) {
            throw 'The remote tag no longer matches the push event and checkout.'
          }
          git merge-base --is-ancestor $tagCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must point to a commit in origin/main history.' }

          gh release create $tag $env:D4_RELEASE_EXE `
            --repo $repo `
            --verify-tag `
            --title "D4 HELP $tag" `
            --notes-file $notesFile
